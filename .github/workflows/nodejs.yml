name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Match frontend/package.json packageManager field.
          version: 10.33.4
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test:run
      - name: Feed XML goldens
        run: pnpm run snapshot:feeds
      # next-env.d.ts is gitignored, so a clean checkout has no image-module
      # declarations and `tsc` fails until Next generates them. CI was disabled for
      # long enough that this breakage was invisible.
      - name: Generate Next types
        run: pnpm exec next typegen
      - name: Typecheck
        run: npx tsc --noEmit
      # AGENTS.md lists `pnpm run build` as a required pre-submission check; without
      # it, bundling and prerender errors only surface in Coolify after merge.
      # `prebuild` generates public/changelog.md and syncs the shared contracts;
      # calling next build directly would skip it and fail on a clean checkout.
      - name: Production build
        run: pnpm run prebuild && pnpm exec next build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Match backend/package.json packageManager field.
          version: 10.33.4
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test:run
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Admin typecheck
        run: npx tsc -p src/admin/tsconfig.json
      - name: Production build
        run: pnpm exec strapi build
