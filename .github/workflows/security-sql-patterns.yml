name: Security — SQL template patterns

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sql-template-guard:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs: this workflow runs on the untrusted-code path
      # (`pull_request`) and is the repo's only security gate.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
      - name: Check for unsafe SQL string building in raw calls
        run: node scripts/check-sql-injection-patterns.mjs
