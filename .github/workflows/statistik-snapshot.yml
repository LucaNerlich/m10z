# Refresh frontend/public/statistik/snapshot.yaml from the production Strapi MCP.
# Commits directly to main when the snapshot changes.
#
# Required secrets:
#   STRAPI_MCP_ADMIN_TOKEN_PROD — Bearer token for https://cms.m10z.de/mcp
#   PAT — classic/fine-grained token with contents write
#         (same secret as merge-schedule; push to main must use a PAT so CI runs)
name: Statistik Snapshot

on:
  workflow_dispatch:
  schedule:
    # Sunday 22:00 UTC (Sunday night)
    - cron: '0 22 * * 0'

concurrency:
  group: statistik-snapshot
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout main
        # Pinned to a commit SHA (not the mutable v7 tag) because later
        # steps push directly to main with a write-capable token.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.PAT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Match frontend/package.json packageManager field.
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Generate statistik snapshot
        working-directory: frontend
        env:
          STRAPI_MCP_ADMIN_TOKEN_PROD: ${{ secrets.STRAPI_MCP_ADMIN_TOKEN_PROD }}
        run: pnpm run snapshot:statistik

      - name: Commit snapshot to main
        # Pinned to a commit SHA (not the mutable v7 tag) because this
        # step pushes commits to main.
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: 'chore(statistik): refresh snapshot'
          file_pattern: frontend/public/statistik/snapshot.yaml
          branch: main
