name: Merge Schedule

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
  schedule:
    # https://crontab.guru -> at 09:00
    - cron: '0 * * * *'

# Least privilege: the workflow default is read, and write scopes are granted
# only to the job that merges (it holds a merge-capable PAT).
permissions:
  contents: read

# Queue rather than cancel: an hourly run must finish its merge.
concurrency:
  group: merge-schedule
  cancel-in-progress: false

jobs:
  merge_schedule:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Pinned to a commit SHA (not the mutable v2 tag) because this step is
      # granted a merge-capable PAT below.
      - uses: gr2m/merge-schedule-action@a9b6ddcf1282dfd66907bda8e7941dff59f03bad # v2.7.0
        with:
          # Merge method to use. Possible values are merge, squash or
          # rebase. Default is merge.
          merge_method: squash
          # Time zone to use. Default is UTC.
          time_zone: 'Europe/Berlin'
          # Require all pull request statuses to be successful before
          # merging. Default is `false`.
          require_statuses_success: 'true'
          # Label to apply to the pull request if the merge fails. Default is
          # `automerge-fail`.
          automerge_fail_label: 'merge-schedule-failed'
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
