name: Shared contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shared-contracts:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs, matching the policy documented in the other workflows.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
      - name: Check that the committed shared-contract copies match shared/
        run: node scripts/check-shared-contracts.mjs
