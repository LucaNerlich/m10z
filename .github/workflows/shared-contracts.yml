name: Shared contracts

on:
  pull_request:
  push:
    branches: [main]

jobs:
  shared-contracts:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs, matching the policy documented in the other workflows.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
      - name: Check that the committed shared-contract copies match shared/
        run: node scripts/check-shared-contracts.mjs
