# Refresh frontend/public/media-index.json from the production Strapi MCP.
# Commits directly to main when the index changes.
#
# The index is the url → {alt, caption, blurhash} snapshot the frontend uses to
# enrich inline Markdown images (see src/lib/media/mediaIndex.ts). Run it after
# updating Media Library metadata (e.g. `pnpm caption:images` in backend/).
#
# Required secrets:
#   STRAPI_MCP_ADMIN_TOKEN_PROD — Bearer token for https://cms.m10z.de/mcp
#   PAT — classic/fine-grained token with contents write
#         (shared push PAT; push to main must use a PAT so CI runs)
name: Media Index

on:
    workflow_dispatch:
    schedule:
        # Monday 03:00 UTC, after the nightly caption/index crons.
        - cron: '0 3 * * 1'

concurrency:
    group: media-index
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    refresh:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        # The push below authenticates with the PAT, so the job needs only the
        # workflow-level contents: read for the checkout.
        steps:
            - name: Checkout main
              # Pinned to a commit SHA (not the mutable v7 tag).
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: main
                  # The push below carries the PAT itself, so the credential never
                  # sits in .git/config while pnpm install runs dependency scripts.
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  # Match frontend/package.json packageManager field.
                  version: 10.33.4

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '22'
                  cache: pnpm
                  cache-dependency-path: frontend/pnpm-lock.yaml

            - name: Install frontend dependencies
              working-directory: frontend
              run: pnpm install --frozen-lockfile

            - name: Generate media index
              working-directory: frontend
              env:
                  STRAPI_MCP_ADMIN_TOKEN_PROD: ${{ secrets.STRAPI_MCP_ADMIN_TOKEN_PROD }}
              run: pnpm run media:index

            - name: Commit index to main
              # The PAT is passed to this one push instead of being installed in
              # .git/config by actions/checkout, so dependency install scripts cannot
              # read a credential that can write to main.
              env:
                  PAT: ${{ secrets.PAT }}
              run: |
                  set -euo pipefail
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add frontend/public/media-index.json
                  if git diff --cached --quiet; then
                      echo 'media index unchanged'
                      exit 0
                  fi
                  git commit -m 'chore(media): refresh media index' --author="${GITHUB_ACTOR} <${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com>"
                  git push "https://x-access-token:${PAT}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
