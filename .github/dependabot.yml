# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Each workspace is an independent pnpm project (there is no root manifest),
  # so every manifest needs its own entry. Pointing at "/" found nothing.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      next-react:
        applies-to: version-updates
        patterns:
          - "react*"
          - "next*"
      types:
        applies-to: version-updates
        patterns:
          - "@types*"

  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      # Grouped so the Strapi packages cannot skew against each other.
      strapi:
        applies-to: version-updates
        patterns:
          - "@strapi*"
          - "strapi"
      types:
        applies-to: version-updates
        patterns:
          - "@types*"

  - package-ecosystem: "npm"
    directory: "/load-test"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
